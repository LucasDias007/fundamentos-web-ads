<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>Pagina de Cadastro</h1>
    </header>
    <main>
        <section>
            <form id="registerForm" method="POST">
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" required/>
                <br>
                <label for="email">Informe seu email:</label>
                <input type="email" id="email" name="email" required/>
                <br>
                <label for="senha"> Informe sua senha: </label>
                <input id="senha" name="senha" type="password" required minlength="8" maxlength="12"/>
                <br>
                <input type="text" id="cpf" name="cpf" placeholder="CPF" pattern="\d{3}.\d{3}.\d{3}-\d{2}"
                title="Formato esperado: 000.000.000-00"/>
                <br>
                
                <textarea id="mensagem" name="mensagem" rows="4" cols="30" placeholder="Digite o texto"></textarea>
                <br>
                <label for="evento">Escolha seu evento: </label>
                <select id="evento" name="evento">]
                    <option value="Rock">Show Rock</option>
                    <option value="Sertanejo">Show Sertanejo</option>
                    <option value="Jogos">Jogos Universitário</option>

                </select>
                <br>
                <label for="termos">
                    <input id="termos" name="termos" type="checkbox" required/> Concordo com os termos de uso
                </label>
                <br>
                <label>
                    <input type="radio" value="pix" name="pagamento"/>Pix
                </label>
                <label>
                    <input type="radio" value="Cartao" name="pagamento"/>Cartão
                </label>
                <br>
                <input type="number" step="5"/>
                <input type="submit" value="Cadastrar" />   -






            </form>
        </section>
    </main>
    <footer>
        <p> &copy; Desenvolvido por Lucas Dias</p>
    </footer>

    <script>
        document.getElementById('registerForm')
        .addEventListener('submit',function(event){
            event.preventDefault();
            const nome = document.getElementById('nome').value
            const cpf = document.getElementById('cpf').value
            const password = document.getElementById('senha').value
            alert('Olá' +nome+ 'o formulário foi preenchido')
            alert('Aqui estão seus dados: ' + cpf+ " "+password)
            alert("Formulário")})
    </script>
</body>
</html>
